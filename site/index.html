<!doctype html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ESP32 Académie</title>
<link rel="icon" type="image/png" sizes="64x64" href="/icons/icon-64.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#08100e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ESP32">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Manrope:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
<script>
  try {
    const saved = localStorage.getItem("esp32-theme");
    const prefers = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    document.documentElement.dataset.theme = saved || prefers;
  } catch (e) {}
</script>
</head>
<body>
  <div class="backdrop" aria-hidden="true"></div>

  <div class="app">
    <nav class="rail" aria-label="Navigation principale">
      <a class="rail__brand" href="#/" aria-label="ESP32 Académie, accueil" id="brand"></a>
      <div class="rail__items" id="rail-items"></div>
      <div class="rail__foot">
        <button class="icon-btn" id="theme-btn" type="button" aria-label="Changer de thème"></button>
      </div>
    </nav>

    <div class="shell">
      <header class="topbar">
        <h1 class="topbar__title" id="view-title">Accueil</h1>
        <a class="xp" id="xp" href="#/succes"></a>
        <label class="search">
          <span class="visually-hidden">Rechercher un chapitre ou un document</span>
          <span class="search__icon" id="search-icon" aria-hidden="true"></span>
          <input id="search" type="search" placeholder="Rechercher : LED, servo, datasheet…" autocomplete="off">
        </label>
        <button class="btn" id="btn-pdf" type="button"></button>
        <button class="icon-btn topbar__theme" id="theme-btn-2" type="button" aria-label="Changer de thème"></button>
      </header>

      <main id="view" tabindex="-1"></main>
    </div>
  </div>

  <dialog id="chapter-dialog" aria-labelledby="dlg-title"></dialog>
  <dialog id="celebrate" aria-labelledby="cele-title"></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="game.js"></script>
  <script src="core.js"></script>
  <script src="home.js"></script>
  <script src="chapters.js"></script>
  <script src="shop.js"></script>
  <script src="reference.js"></script>
  <script src="dialog.js"></script>
  <script src="main.js"></script>
</body>
</html>
